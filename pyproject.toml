[project]
name = "my-aur-repo"
version = "0.1.0"
description = "Automation for a personal Arch Linux binary repository"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "packaging>=24.2,<26",
]

[project.scripts]
my-aur = "my_aur.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automation/my_aur"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["my_aur"]
